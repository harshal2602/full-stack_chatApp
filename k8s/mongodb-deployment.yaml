kind: Deployment
apiVersion: apps/v1
metadata:
  name: mongodb-deployment
  namespace: chat-app
spec:
  replicas: 1
  selector:
    matchLabels: # Fixed capitalization (matchLabels)
      app: mongodb
  template:
    metadata:
      labels: # Removed redundant metadata fields (name/namespace not used here)
        app: mongodb
    spec: # Fixed typo (specc -> spec)
      containers:
      - name: mongodb-container
        image: mongo:latest
        ports:
        - containerPort: 27017
        env:
        - name: MONGO_INITDB_ROOT_USERNAME
          value: mongoadmin
        - name: MONGO_INITDB_ROOT_PASSWORD
          value: secret
        volumeMounts: # Added missing section to actually use the volume
        - name: mongodb-data
          mountPath: /data/db
      volumes:
      - name: mongodb-data
        persistentVolumeClaim:
          claimName: mongodb-pvc # Double-check this matches your actual PVC name
